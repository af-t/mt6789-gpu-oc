name: Build LKM (GKI android16-6.12-2025-09)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm64
    strategy:
      matrix:
        freq: [1200, 1250, 1300, 1350, 1400, 1450, 1500, 1550, 1600, 1650, 1700]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            dwarves clang lld llvm git make gcc-aarch64-linux-gnu

      - name: Clone GKI common (android16-6.12-2025-09 = 6.12.38)
        run: |
          git clone --depth 1 -b android16-6.12-2025-09 \
            https://android.googlesource.com/kernel/common kernel-common
          cd kernel-common
          git log --oneline -1
          grep -m1 UTS_RELEASE include/generated/utsrelease.h 2>/dev/null || true
          head -5 Makefile

      - name: Prepare kernel build dir
        run: |
          cd kernel-common
          make ARCH=arm64 LLVM=1 gki_defconfig
          make ARCH=arm64 LLVM=1 -j$(nproc) modules_prepare

      - name: Build module
        run: |
          python3 tools/gen_opp.py ${{ matrix.freq }} > src/opp_table.h
          make -C kernel-common ARCH=arm64 LLVM=1 M=$GITHUB_WORKSPACE modules
          ls -lh src/*.ko
          file src/*.ko
          modinfo src/gpu_uvoc_mt6789.ko || true
          mkdir -p dist
          mv src/gpu_uvoc_mt6789.ko dist/gpu_uvoc_mt6789_${{ matrix.freq }}.ko

      - uses: actions/upload-artifact@v4
        with:
          name: gpu_uvoc_mt6789-${{ matrix.freq }}-6.12.38-android16-2025-09
          path: dist/gpu_uvoc_mt6789_${{ matrix.freq }}.ko
