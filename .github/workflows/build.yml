name: Build LKM (GKI android16-6.12-2025-09)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm64
    strategy:
      matrix:
        freq: [1200, 1250, 1300, 1350, 1400, 1450, 1500, 1550, 1600, 1650, 1700]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libdwarf-dev \
            dwarves clang lld llvm git make gcc-aarch64-linux-gnu

      - name: Clone GKI common (android16-6.12-2025-09 = 6.12.38)
        run: |
          git clone --depth 1 -b android16-6.12-2025-09 \
            https://android.googlesource.com/kernel/common kernel-common
          cd kernel-common
          git log --oneline -1
          grep -m1 UTS_RELEASE include/generated/utsrelease.h 2>/dev/null || true
          head -5 Makefile

      - name: Prepare kernel build dir
        run: |
          cd kernel-common
          make ARCH=arm64 LLVM=1 gki_defconfig
          # Match target kernel CFI scheme; without this, modules panic on load.
          ./scripts/config --enable CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 -j$(nproc) modules_prepare

      - name: Build module
        run: |
          python3 tools/gen_opp.py ${{ matrix.freq }} > src/opp_table.h
          make -C kernel-common ARCH=arm64 LLVM=1 M=$GITHUB_WORKSPACE \
            KBUILD_EXTRA_SYMBOLS=$GITHUB_WORKSPACE/Extra.symvers KBUILD_MODPOST_WARN=1 modules
          ls -lh src/*.ko
          file src/*.ko
          modinfo src/gpu_uvoc_mt6789.ko || true
          sz=$(readelf -SW src/gpu_uvoc_mt6789.ko | awk '/this_module/ && /PROGBITS/{print $6}')
          [ "$sz" = "000640" ] || { echo "struct size $sz != 000640, will NOT load on Wild"; exit 1; }
          undef=$(nm src/gpu_uvoc_mt6789.ko | grep " U " | grep -v -E " _(printk|fortify_panic)|gpufreq_get_(working_table|opp_num)|module_layout" || true)
          [ -z "$undef" ] || { echo "foreign undef: $undef"; exit 1; }
          # exit ptr must sit at 0x5f8 in __this_module (BTF-on layout).
          # At 0x5e0 (BTF-off layout) the phone reads NULL -> [permanent], rmmod EBUSY.
          exitoff=$(readelf -r src/gpu_uvoc_mt6789.ko | awk '/rela.gnu.linkonce.this_module/{f=1} f && /cleanup_module/{print $1; exit}')
          [ "$exitoff" = "0000000005f8" ] || { echo "exit offset $exitoff != 0x5f8, unload will fail on Wild"; exit 1; }
          mkdir -p dist
          mv src/gpu_uvoc_mt6789.ko dist/gpu_uvoc_mt6789_${{ matrix.freq }}.ko

      - uses: actions/upload-artifact@v4
        with:
          name: gpu_uvoc_mt6789-${{ matrix.freq }}-6.12.38-android16-2025-09
          path: dist/gpu_uvoc_mt6789_${{ matrix.freq }}.ko
